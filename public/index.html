<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Desenho Assinado</h1>

    <!-- Botão de login da Google -->
    <div id="g_id_onload"
         data-client_id="552940396793-8uj5n4bctmg2g3ckju26k4b1gk73qosn.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <!-- Formulário apenas com o número -->
    <form id="form-desenho">
      <label for="numero">Número (1 a 100):</label>
      <input type="number" id="numero" min="1" max="100" required>
      <button type="submit" id="btn-gerar">Gerar Desenho</button>
    </form>

    <!-- Áreas para exibir mensagens de erro e o desenho SVG -->
    <div id="mensagem-erro" style="color: red; margin-top: 10px; display: none;"></div>
    <div id="resultado-svg" style="margin-top: 20px;"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
